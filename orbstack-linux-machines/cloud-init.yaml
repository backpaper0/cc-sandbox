#cloud-config
# OrbStack の Linux machine (Ubuntu) 用セットアップ
#
#   orb create -c cloud-init.yaml ubuntu my-machine
#
# インストールするもの:
#   - mise（apt リポジトリ）
#   - Docker Engine（apt リポジトリ）
#   - Claude Code（公式ネイティブインストーラ）
#   - Playwright MCP（Claude Code からブラウザを操作するため）
#   - machine 専用のユーザー設定（.gitconfig / .vimrc / .claude/settings.json）
#
# 構成について:
#   OrbStack は macOS ユーザーと同名のデフォルトユーザーを cloud-init の「完了後」に作る
#   （UID も macOS 側と同じで 1000 とは限らない）。そのため cloud-init 実行中はまだ
#   対象ユーザーが存在せず、runcmd の中では docker グループ追加も Claude Code の
#   インストールもできない。
#   そこでユーザーに依存しない部分だけを runcmd で行い、ユーザー依存の部分は
#   provision-user.service（oneshot）に切り出してユーザーの出現を待たせている。

package_update: true
package_upgrade: true

packages:
  - ca-certificates
  - curl
  - gnupg
  - git
  - unzip
  # gitconfig の core.editor が vim を指しているので（既定では vim-tiny しか無い）
  - vim
  # ヘッドレスブラウザで日本語・中国語・韓国語が豆腐にならないように
  - fonts-noto-cjk

write_files:
  # --- ログインシェル共通の環境設定 -------------------------------------------
  # OrbStack のセッションは常にログインシェルなので /etc/profile.d が読まれる。
  # デフォルトユーザーが後から作られてもこちらは影響を受けない。
  - path: /etc/profile.d/99-dev-env.sh
    permissions: "0644"
    owner: root:root
    content: |
      # ユーザーローカルにインストールしたコマンド（Claude Code など）
      case ":${PATH}:" in
        *":$HOME/.local/bin:"*) ;;
        *) PATH="$HOME/.local/bin:$PATH"; export PATH ;;
      esac

      export EDITOR=vim

      # mise（OrbStack のセッションでは profile.d が複数回評価されるため、
      # shims が PATH に積み上がらないようガードする）
      if [ -n "${BASH_VERSION-}" ] && command -v mise >/dev/null 2>&1; then
        case $- in
          *i*)
            eval "$(mise activate bash)"
            ;;
          *)
            case ":${PATH}:" in
              *":$HOME/.local/share/mise/shims:"*) ;;
              *) eval "$(mise activate bash --shims)" ;;
            esac
            ;;
        esac
      fi

      # machine 自体が隔離環境で壊れても作り直せるので、確認を全部飛ばす。
      # bash は非対話シェルでエイリアスを展開しないので、対話セッション限定になる
      # （`orb -m ... claude ...` のような単発実行には効かない）。
      alias claude="claude --allow-dangerously-skip-permissions --permission-mode bypassPermissions"

  # --- machine 専用のユーザー設定 ----------------------------------------------
  # ホストの dotfiles は持ち込まない（マウントも clone もしない）。この machine で
  # 使う設定をここで完結して定義する。デフォルトユーザーの HOME は cloud-init の
  # 時点では判らないので、ホーム配下への配置は provision-user.sh が行う。
  - path: /usr/local/share/machine-config/gitconfig
    permissions: "0644"
    owner: root:root
    content: |
      # machine 専用の git 設定
      #
      # user.name / user.email は下の [include] で上書きできる（後勝ち）。
      # 他の人が使うときは、この YAML を編集せずに machine 側で
      #   git config -f ~/.gitconfig.local user.name  "..."
      #   git config -f ~/.gitconfig.local user.email "..."
      # とすればよい。
      [user]
      	name = Uragami Taichi
      	email = backpaper0@gmail.com
      [core]
      	editor = vim
      	quotepath = false
      [init]
      	defaultBranch = main
      [color]
      	ui = auto
      [alias]
        co = checkout
        ci = commit
        st = status
        br = branch
        lg = log --graph --decorate --branches
        ca = commit --amend --no-edit --reset-author
      # 個人設定での上書き用。ファイルが無ければ git は黙って無視する。
      # 位置が後ろなので、ここに書いた値が上のデフォルトより優先される。
      [include]
      	path = ~/.gitconfig.local

  - path: /usr/local/share/machine-config/vimrc
    permissions: "0644"
    owner: root:root
    content: |
      " machine 専用の vim 設定。ちょっとした編集ができれば十分という想定
      set encoding=utf-8
      set fileencodings=utf-8,cp932,euc-jp
      syntax on
      filetype plugin indent on
      set number
      set expandtab
      set tabstop=2
      set shiftwidth=2
      set incsearch
      set hlsearch
      set ignorecase
      set smartcase
      set backspace=indent,eol,start
      set laststatus=2

  - path: /usr/local/share/machine-config/claude-settings.json
    permissions: "0644"
    owner: root:root
    content: |
      {
        "awaySummaryEnabled": false,
        "cleanupPeriodDays": 9999,
        "disableAutoMode": "disable",
        "language": "japanese",
        "skipDangerousModePermissionPrompt": true,
        "spinnerTipsEnabled": false,
        "theme": "light",
        "tui": "fullscreen"
      }

  # --- システム側のセットアップ（cloud-init の runcmd から実行）---------------
  - path: /usr/local/sbin/provision-system.sh
    permissions: "0755"
    owner: root:root
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      trap 'echo "provision-system.sh: failed at line ${LINENO}" >&2' ERR

      ARCH="$(dpkg --print-architecture)"
      CODENAME="$(. /etc/os-release && echo "${UBUNTU_CODENAME:-$VERSION_CODENAME}")"
      echo "provision-system: arch=${ARCH} codename=${CODENAME}"

      install -m 0755 -d /etc/apt/keyrings

      # mise の apt リポジトリ
      curl -fsSL https://mise.jdx.dev/gpg-key.pub \
        | gpg --dearmor -o /etc/apt/keyrings/mise-archive-keyring.gpg
      chmod a+r /etc/apt/keyrings/mise-archive-keyring.gpg
      echo "deb [arch=${ARCH} signed-by=/etc/apt/keyrings/mise-archive-keyring.gpg] https://mise.jdx.dev/deb stable main" \
        > /etc/apt/sources.list.d/mise.list

      # Docker の apt リポジトリ
      curl -fsSL https://download.docker.com/linux/ubuntu/gpg \
        -o /etc/apt/keyrings/docker.asc
      chmod a+r /etc/apt/keyrings/docker.asc
      echo "deb [arch=${ARCH} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu ${CODENAME} stable" \
        > /etc/apt/sources.list.d/docker.list

      apt-get update
      DEBIAN_FRONTEND=noninteractive apt-get install -y \
        mise \
        docker-ce \
        docker-ce-cli \
        containerd.io \
        docker-buildx-plugin \
        docker-compose-plugin

      systemctl enable --now docker

      # デフォルトユーザーが作られてから走る後処理を仕込む
      systemctl enable provision-user.service
      systemctl start --no-block provision-user.service

  # --- ユーザー側のセットアップ（デフォルトユーザー作成後に実行）-------------
  - path: /usr/local/sbin/provision-user.sh
    permissions: "0755"
    owner: root:root
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      trap 'echo "provision-user.sh: failed at line ${LINENO}" >&2' ERR

      # OrbStack のデフォルトユーザーは orbstack グループに入るので、それを待つ。
      # cloud-init が作った ubuntu ユーザーを誤って掴まないよう、こちらを優先する。
      TARGET_USER=""
      for _ in $(seq 1 60); do
        TARGET_USER="$(getent group orbstack 2>/dev/null | cut -d: -f4 | cut -d, -f1 || true)"
        [ -n "$TARGET_USER" ] && break
        sleep 2
      done

      # OrbStack 以外で使う場合のフォールバック
      if [ -z "$TARGET_USER" ]; then
        TARGET_USER="$(awk -F: '$3>=500 && $3<65534 && $6 ~ /^\/home\// && $7 !~ /(nologin|false)$/ { print $1; exit }' /etc/passwd || true)"
      fi

      if [ -z "$TARGET_USER" ]; then
        echo "provision-user: default user not found" >&2
        exit 1
      fi

      TARGET_HOME="$(getent passwd "$TARGET_USER" | cut -d: -f6)"
      echo "provision-user: user=${TARGET_USER} home=${TARGET_HOME}"

      # sudo なしで docker を使えるようにする（machine に入り直すと有効）
      usermod -aG docker "$TARGET_USER"

      # --mount のマウントポイントがホーム配下にあると、OrbStack が親ディレクトリを
      # root 所有で先に作ってしまい、ホームがユーザーから書けなくなる。
      # （Claude Code や mise は $HOME 配下にインストールするので致命的）
      chown "$TARGET_USER" "$TARGET_HOME"

      # 対象ユーザーとしてコマンドを流すための小道具
      as_user() {
        runuser -u "$TARGET_USER" -- env HOME="$TARGET_HOME" "$@"
      }

      # --- ユーザー設定 ---------------------------------------------------------
      # machine 専用の設定を配る。ホストの dotfiles は持ち込まない。
      # 実体は write_files（このファイルの上のほう）にあり、ここでは配置だけ行う。
      install -m 0644 -o "$TARGET_USER" \
        /usr/local/share/machine-config/gitconfig "${TARGET_HOME}/.gitconfig"
      install -m 0644 -o "$TARGET_USER" \
        /usr/local/share/machine-config/vimrc "${TARGET_HOME}/.vimrc"

      install -d -m 0755 -o "$TARGET_USER" "${TARGET_HOME}/.claude"
      install -m 0644 -o "$TARGET_USER" \
        /usr/local/share/machine-config/claude-settings.json \
        "${TARGET_HOME}/.claude/settings.json"

      # Claude Code は $HOME 配下にしか入らないので、対象ユーザーとして実行する。
      # sudo 経由だとインストーラに拒否されるため runuser を使う。
      if [ ! -x "${TARGET_HOME}/.local/bin/claude" ]; then
        as_user bash -c 'curl -fsSL https://claude.ai/install.sh | bash'
      fi

      # --- Playwright MCP -------------------------------------------------------
      # Claude Code は MCP サーバーを `npx` で起動するので、mise の shims から npx を
      # 引けるよう node を global に固定しておく（これが無いと shims はあっても
      # バージョン未指定で解決に失敗する）。
      as_user mise use -g node@lts

      # ブラウザの実行に必要な OS パッケージ。root で入れる必要がある。
      DEBIAN_FRONTEND=noninteractive \
        mise exec node@lts -- npx -y playwright install-deps

      # ブラウザ本体は対象ユーザーの ~/.cache/ms-playwright に入れる
      as_user mise exec node@lts -- npx -y @playwright/mcp install-browser chrome-for-testing

      # MCP サーバーとして登録する（~/.claude.json に書かれる）
      as_user "${TARGET_HOME}/.local/bin/claude" \
        mcp add playwright --scope user -- npx -y @playwright/mcp@latest --browser chromium

      touch /var/lib/provision-user.done
      echo "provision-user: done"

  - path: /etc/systemd/system/provision-user.service
    permissions: "0644"
    owner: root:root
    content: |
      [Unit]
      Description=Provision the default user (user config, Claude Code, Playwright MCP)
      After=cloud-final.service network-online.target
      Wants=network-online.target
      ConditionPathExists=!/var/lib/provision-user.done

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/usr/local/sbin/provision-user.sh

      [Install]
      WantedBy=multi-user.target

runcmd:
  - [/usr/local/sbin/provision-system.sh]

final_message: "cloud-init finished after $UPTIME seconds"
